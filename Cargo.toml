[workspace]
resolver = "3"
members = ["crates/coqui-agentic-peer"]

[workspace.package]
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-agentic-peer"
homepage = "https://boriken-dev.github.io/coqui-agentic-peer/"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"

# One PeerId type across the graph needs one source.
[patch.crates-io]
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "984db3d54b73de10c7892b06fe269a259de2d1c5" }
