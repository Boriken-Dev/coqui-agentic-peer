[package]
name = "coqui-agentic-peer"
description = "A proven link between two peers: pair once, then ACP, A2A, MCP or anything else over it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["agent", "peer", "acp", "a2a", "mcp"]
categories = ["network-programming"]
exclude = [".*", "*.local.*"]
# Nothing is published until the owner chooses a release.
publish = false

[dependencies]
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "984db3d54b73de10c7892b06fe269a259de2d1c5" }
coqui-builder = { git = "https://github.com/Boriken-Dev/coqui-builder", rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad" }
coqui-peer-webcrypto = { git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto", rev = "9146f55dd9fb9be8d6d96f43e17bc7a057ba0681", features = ["pin"] }
# The Noise method, with `pin` for PIN pairing inside its session.
coqui-peer-noise = { git = "https://github.com/Boriken-Dev/coqui-peer-noise", rev = "3a5b30689780a6e6291af565ff6abbaae515973c", features = ["pin"] }
coqui-web-channel = { git = "https://github.com/Boriken-Dev/coqui-web-channel.git", rev = "0b5b05c9af3417f6b13edc0fc7d9c86c02a63eca" }
# Pure Rust, with no system mDNS service to depend on.
mdns-sd = "0.21"
serde_json = "1"
# Ending a connection with a reset, which std cannot do.
socket2 = "0.6"
url = "2.5"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
