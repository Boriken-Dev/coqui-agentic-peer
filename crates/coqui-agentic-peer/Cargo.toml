[package]
name = "coqui-agentic-peer"
description = "A proven link between two peers: pair once, then ACP, A2A, MCP or anything else over it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["agent", "peer", "acp", "a2a", "mcp"]
categories = ["network-programming"]
exclude = [".*", "*.local.*"]
# Nothing is published until the owner chooses a release.
publish = false

[dependencies]
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "b6aa1f47ca956578ffcd20f936c43e8663ed059a" }
coqui-peer-webcrypto = { git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto", rev = "a491a0034e0a9084c7aa3a5298f3b3c649ae7941", features = ["pin"] }
# The Noise method, with `pin` for PIN pairing inside its session.
coqui-peer-noise = { git = "https://github.com/Boriken-Dev/coqui-peer-noise", rev = "169db79428af8f5824c7f151f8fa4601f34854dc", features = ["pin"] }
coqui-web-channel = { git = "https://github.com/Boriken-Dev/coqui-web-channel.git", rev = "0b5b05c9af3417f6b13edc0fc7d9c86c02a63eca" }
# Pure Rust, with no system mDNS service to depend on.
mdns-sd = "0.21"
serde_json = "1"
# Ending a connection with a reset, which std cannot do.
socket2 = "0.6"
url = "2.5"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
