[package]
name = "coqui-agentic-peer"
description = "A proven link between two peers: pair once, then ACP, A2A, MCP or anything else over it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["agent", "peer", "acp", "a2a", "mcp"]
categories = ["network-programming"]
exclude = [".*", "*.local.*"]
# Nothing is published until the owner chooses a release.
publish = false

[dependencies]
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "381e2a8144a228e592dc7d82eeb7db85885422ec" }
coqui-peer-webcrypto = { git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto", rev = "95ee8d4a6d4ed461bd53021c92972e79bf10a864", features = ["pin"] }
# The Noise method, with `pin` for PIN pairing inside its session.
coqui-peer-noise = { git = "https://github.com/Boriken-Dev/coqui-peer-noise", rev = "6fd5137ef13d908581f6d1c9b0ca6b1bc19e3df3", features = ["pin"] }
coqui-web-channel = { git = "https://github.com/Boriken-Dev/coqui-web-channel.git", rev = "0b5b05c9af3417f6b13edc0fc7d9c86c02a63eca" }
# Pure Rust, with no system mDNS service to depend on.
mdns-sd = "0.21"
serde_json = "1"
# Ending a connection with a reset, which std cannot do.
socket2 = "0.6"
url = "2.5"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
