[package]
name = "coqui-agentic-peer"
description = "A proven link between two peers: pair once, then ACP, A2A, MCP or anything else over it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["agent", "peer", "acp", "a2a", "mcp"]
categories = ["network-programming"]
exclude = [".*", "*.local.*"]
# Nothing is published until the owner chooses a release.
publish = false

[dependencies]
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "1f00bfe6319f64e7ec038a7003746f4f031d538c" }
coqui-peer-webcrypto = { git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto", rev = "a3776fba131415d006f68ea493120fd7f894244a", features = ["pin"] }
# The Noise method, with `pin` for PIN pairing inside its session.
coqui-peer-noise = { git = "https://github.com/Boriken-Dev/coqui-peer-noise", rev = "8777403807e3ad6eb6fddc98d9b5b6753bb0e424", features = ["pin"] }
coqui-web = { git = "https://github.com/Boriken-Dev/coqui-web", rev = "6fd0ca3446e7702d2dd323824a6b97b31851d665" }
# Pure Rust, with no system mDNS service to depend on.
mdns-sd = "0.21"
serde_json = "1"
# Ending a connection with a reset, which std cannot do.
socket2 = "0.6"
url = "2.5"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
